<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Versatilo Tool</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<script>/* apply the saved theme before first paint (no flash) */try{const t=localStorage.getItem('versatilo-theme');if(t)document.documentElement.dataset.theme=t;}catch{}</script>
<script>/* old bookmarks of the SQA tool (index.html#docs) */if(location.hash==='#docs')location.replace('sqa.html');</script>
<!-- Version + asset loader: js/version.js is the only place the version is set -->
<script>document.write('<script src="js/version.js?t=' + Date.now() + '"><\/script>');</script>
<script>loadAssets([
  'css/base.css', 'css/layout.css', 'css/components.css', 'css/home.css', 'css/print.css',
  'js/layout.js',
]);</script>
</head>
<body>
<div class="app">
<script>Layout.sidebar('home');</script>

  <!-- ===== Main area ===== -->
  <div class="main">
<script>Layout.topbar('home');</script>

    <div class="wrap">
      <header class="home-hero">
        <img src="favicon.svg" alt="">
        <div>
          <h1>Versatilo Tool</h1>
          <p>Reports, documentation, document editing and app icons, all in one place. Pick a tool to get started.</p>
        </div>
      </header>

      <h2 class="home-sec">Workspace</h2>
<script>Layout.cards();</script>

      <h2 class="home-sec">Preferences</h2>
      <div class="home-grid prefs">
        <button type="button" class="home-card" id="homeSettings" style="--c:#0891b2">
          <span class="hc-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></span>
          <span class="hc-txt"><b>Settings</b><small>GitHub token &amp; Gemini key</small></span>
          <span class="badge" id="homeDot">NULL</span>
        </button>
        <button type="button" class="home-card" id="homeTheme" style="--c:#475569">
          <span class="hc-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></span>
          <span class="hc-txt"><b>Theme</b><small id="homeThemeLabel">System</small></span>
        </button>
      </div>
    </div>
  </div>
</div>

<script>Layout.dialogs();</script>

<!-- Scripts: classic scripts share one global scope, so the order matters -->
<script>
loadAssets([
  'js/common.js', 'js/gemini.js', 'js/github.js', 'js/ui.js', 'js/shell.js',
]);
</script>
<script>
/* Preferences cards reuse the sidebar buttons, and mirror their labels */
(() => {
  const sync = () => {
    const dot = document.getElementById('navDot');
    homeDot.textContent = dot.textContent; homeDot.classList.toggle('on', dot.classList.contains('on'));
    homeThemeLabel.textContent = document.getElementById('themeLabel').textContent;
  };
  homeSettings.onclick = () => document.getElementById('navSettings').click();
  homeTheme.onclick = () => { document.getElementById('themeBtn').click(); sync(); };
  new MutationObserver(sync).observe(document.getElementById('navDot'), { childList: true, attributes: true });
  window.addEventListener('load', sync);
  sync();
})();
</script>
</body>
</html>
