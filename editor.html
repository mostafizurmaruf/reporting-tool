<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Edit Document</title>
<script>/* apply the saved theme before first paint (no flash) */try{const t=localStorage.getItem('versatilo-theme');if(t)document.documentElement.dataset.theme=t;}catch{}</script>
<!-- Version + asset loader: js/version.js is the only place the version is set -->
<script>document.write('<script src="js/version.js?t=' + Date.now() + '"><\/script>');</script>
<script>loadAssets([
  'css/base.css', 'css/layout.css', 'css/components.css', 'css/editor.css', 'css/print.css',
  'js/layout.js',
]);</script>
</head>
<body class="editmode">
<div class="app">
<script>Layout.sidebar('editor');</script>

  <!-- ===== Main area ===== -->
  <div class="main">
<script>Layout.topbar('editor');</script>

    <div class="wrap">
      <header class="doc">
        <h1>VERSATILO GROUP</h1>
        <h2>EDIT DOCUMENT</h2>
        <p>Upload a report you already made (PDF or DOCX), change the text, then download it again in the same format</p>
      </header>

    <section class="card" id="edPick">
      <label class="drop" id="edDrop" for="edFile">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V4M7 9l5-5 5 5"/><path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg>
        <b>Drop a PDF or DOCX file here, or click to choose</b>
        <small>The file is opened only in this browser – nothing is uploaded to a server.</small>
      </label>
      <input type="file" id="edFile" accept=".pdf,.docx,application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document" hidden>
    </section>

    <section class="card" id="edInfo" hidden>
      <div class="ed-file">
        <span class="ed-badge" id="edType">PDF</span>
        <div><b id="edName"></b><small id="edMeta"></small></div>
        <span class="ed-count" id="edCount">No changes</span>
      </div>
      <div class="ed-find">
        <div><label for="edFind">Find</label><input id="edFind" autocomplete="off" placeholder="e.g. 05 / 11 / 2026"></div>
        <div><label for="edRepl">Replace with</label><input id="edRepl" autocomplete="off"></div>
        <button type="button" id="edReplAll">Replace all</button>
      </div>
      <div class="row-btns">
        <button type="button" id="edOpen">Open another file</button>
        <button type="button" class="danger" id="edReset">Undo all changes</button>
      </div>
      <div class="hint" id="edHint"></div>
    </section>

    <div id="edDoc" class="ed-doc"></div>
    </div>

    <div class="toolbar">
      <span class="status" id="status" role="status" aria-live="polite" data-idle="Open a PDF or DOCX report to start editing.">Open a PDF or DOCX report to start editing.</span>
      <button type="button" id="edPrint" disabled>Print</button>
      <button type="button" class="primary" id="edSave" disabled>Download</button>
    </div>
  </div>
</div>

<script>Layout.dialogs();</script>

<!-- Scripts: classic scripts share one global scope, so the order matters -->
<script>
loadAssets([
  'js/common.js', 'js/docx-builder.js', 'js/gemini.js', 'js/github.js', 'js/ui.js',
  'js/doc-editor.js', 'js/shell.js',
]);
</script>
</body>
</html>
