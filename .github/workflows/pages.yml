# Deploys the site to GitHub Pages on every push to main.
# The Google OAuth client secret is NOT in the repo – it comes from the repository secret
# GOOGLE_CLIENT_SECRET (Settings → Secrets and variables → Actions) and is written into
# js/google-auth.js only in the deployed copy.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Build and deploy are separate jobs (GitHub's recommended layout): the deploy job only
  # starts after the build job has finished, so the uploaded artifact is fully registered
  # by then. Deploying in the same job right after the upload sometimes can't see it yet.
  build:
    runs-on: ubuntu-latest
    outputs:
      artifact: github-pages-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4

      - name: Insert Google client secret
        env:
          SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          if [ -z "$SECRET" ]; then echo "::warning::GOOGLE_CLIENT_SECRET is not set – Google sign-in will ask again every hour."; exit 0; fi
          python3 -c "import os,pathlib; p=pathlib.Path('js/google-auth.js'); t=p.read_text(); assert '__GOOGLE_CLIENT_SECRET__' in t; p.write_text(t.replace('__GOOGLE_CLIENT_SECRET__', os.environ['SECRET']))"

      - name: Remove repo-only files from the site
        run: rm -rf .git .github

      - uses: actions/configure-pages@v5
      # Unique name per attempt: a re-run keeps the earlier attempts' artifacts, and
      # deploy-pages fails if it finds more than one with the same name.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
          name: github-pages-${{ github.run_attempt }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          # From the build job, so "Re-run failed jobs" (deploy only) still finds it.
          artifact_name: ${{ needs.build.outputs.artifact }}
